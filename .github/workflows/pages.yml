name: Validate and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/demo/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix apps/demo ci --ignore-scripts
      - name: Check toolkit
        run: |
          npm run check
          npm test
          node --experimental-strip-types --test acceptance/contract.test.mjs
          npm run build
      - name: Check demo
        run: |
          npm --prefix apps/demo test
          node --experimental-strip-types acceptance/frontend-gate.mjs
      # No lint script is configured in either package.
      - name: Check public repository files
        run: |
          node --test scripts/publication-check.test.mjs
          node scripts/publication-check.mjs --check
      - name: Read Pages metadata
        id: pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Select build base
        env:
          DEPLOYABLE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          CONFIGURED_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$DEPLOYABLE" = "true" ]; then
            base="${CONFIGURED_BASE%/}/"
          else
            base="/commerce-reliability-kit/"
          fi
          echo "PAGES_BASE_PATH=$base" >> "$GITHUB_ENV"
      - name: Build and inspect the static artifact
        run: |
          npm --prefix apps/demo run build
          node scripts/publication-check.mjs --artifact apps/demo/dist --base "$PAGES_BASE_PATH"
      - name: Upload validated static artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/demo/dist

  deploy:
    name: Deploy validated artifact
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
