name: Bug report
description: Report a reproducible problem using synthetic or sanitized evidence.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private URLs, or raw customer exports. Report vulnerabilities privately using SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Scenario and version
      description: Scenario ID, toolkit/demo version, and commit if known.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Commands or UI actions and minimal synthetic inputs.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Separate supported findings from assertion verdicts.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Synthetic or sanitized evidence
      description: Invent a minimal causal example. Inspect identifiers and free text; no raw customer exports.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node/npm or browser version, and build/base path when relevant.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I checked this report for secrets, personal information, and customer data.
          required: true
